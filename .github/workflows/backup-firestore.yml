name: Backup Firestore

on:
  schedule:
    - cron: '0 3 * * *'   # Todos los días a las 3am UTC (medianoche Paraguay)
  workflow_dispatch:        # También permite correrlo manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backup script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: npx ts-node --project scripts/tsconfig.json scripts/backup-firestore.ts

      - name: Commit backup to branch backups
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          BACKUP_FILE="firestore-${DATE}.json"

          # Guardar backup en /tmp antes de cambiar de rama
          cp "backups/${BACKUP_FILE}" "/tmp/${BACKUP_FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          # Cambiar a rama backups o crearla
          if git show-ref --quiet refs/remotes/origin/backups; then
            git checkout -B backups origin/backups
          else
            git checkout --orphan backups
            git rm -rf . --quiet
          fi

          # Restaurar archivo de backup
          mkdir -p backups
          cp "/tmp/${BACKUP_FILE}" "backups/${BACKUP_FILE}"

          # Mantener solo los últimos 30 backups
          ls backups/firestore-*.json 2>/dev/null | sort | head -n -30 | xargs rm -f || true

          git add backups/
          git diff --staged --quiet && echo "Sin cambios nuevos" || git commit -m "backup: Firestore ${DATE}"
          git push origin backups
