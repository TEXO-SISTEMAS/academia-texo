name: Backup Firestore

on:
  schedule:
    - cron: '0 3 * * *'   # Todos los días a las 3am UTC (medianoche Paraguay)
  workflow_dispatch:        # También permite correrlo manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backup script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: npx ts-node --project scripts/tsconfig.json scripts/backup-firestore.ts

      - name: Commit backup to branch backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Cambiar a rama backups (crearla si no existe)
          git fetch origin backups 2>/dev/null || true
          git checkout backups 2>/dev/null || git checkout --orphan backups

          # Traer solo el archivo de backup generado
          git checkout main -- backups/

          git add backups/
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "backup: Firestore $(date -u +'%Y-%m-%d')"
          git push origin backups
